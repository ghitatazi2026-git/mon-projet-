version: '3.8'

services:
  db:
    image: postgres:16
    container_name: local_postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  python_app:
    image: python:3.11-slim
    container_name: python_runner
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - db
    command: sh -c "pip install psycopg2-binary && python test_db.py"

volumes:
  postgres_data:
  